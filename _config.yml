# --- Site Identity --- #
title: Fridolin Paiki
author: Fridolin Paiki
subtitle: "PhD Candidate in Computer Engineering · Northeastern University"
description: "Academic portfolio of Fridolin Febrianto Paiki, PhD Candidate in Computer Engineering at Northeastern University advised by Prof. Mario Sznaier. Researching Machine Learning, Natural Language Processing, Reinforcement Learning, and Explainable AI."

# --- Profile & Academic Metadata --- #
profile:
  name: "Fridolin Febrianto Paiki"
  short_name: "Fridolin Paiki"
  role: "PhD Candidate in Computer Engineering"
  institution: "Northeastern University"
  institution_url: "https://coe.northeastern.edu/"
  lab: "Robust Systems Lab"
  advisor: "Prof. Mario Sznaier"
  advisor_url: "https://coe.northeastern.edu/people/sznaier-mario/"
  location: "Boston, MA"
  email: "paiki.f@northeastern.edu"
  cv_url: "/assets/Fridolin_Paiki_Resume.pdf"
  avatar: "/assets/img/img.jpg"
  research_interests:
    - "Machine Learning"
    - "Natural Language Processing"
    - "Reinforcement Learning"
    - "Explainable AI (XAI)"
    - "Multimodal Healthcare AI"

# --- Navigation Bar Links (Single-Page Smooth Anchor Navigation + CV) --- #
navbar-links:
  About: "#about"
  News: "#news"
  Research: "#research"
  Publications: "#publications"
  Experience: "#experience"
  Education: "#education"
  CV: "/assets/Fridolin_Paiki_Resume.pdf"

# --- Avatar --- #
avatar: "/assets/img/img.jpg"
round-avatar: true

# --- Social & Academic Links --- #
social-network-links:
  email: "paiki.f@northeastern.edu"
  google-scholar: "https://scholar.google.com/citations?user=z2b1j5oAAAAJ&hl=en"
  github: "ffpaiki"
  linkedin: "fridolinpaiki"
  medium: "fridolinpaiki"

rss-description: "Fridolin Paiki — PhD Researcher in Machine Learning, NLP, and Reinforcement Learning at Northeastern University."

# --- General Options --- #
share-links-active:
  twitter: true
  facebook: false
  linkedin: true
  vk: false
  reddit: false

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: false
edit_page_button: false
navbar-var-length: false
keywords: "Fridolin Paiki, Fridolin Febrianto Paiki, Northeastern University, PhD Candidate, Machine Learning, Reinforcement Learning, Natural Language Processing, Explainable AI, Mario Sznaier"

# --- Refined Minimalist Academic Palette (Fallback for legacy pages) --- #
page-col: "#FAFAFA"
text-col: "#18181B"
link-col: "#A6192E"
hover-col: "#7F1222"
navbar-col: "#FFFFFF"
navbar-text-col: "#18181B"
navbar-border-col: "#E4E4E7"
footer-col: "#FAFAFA"
footer-text-col: "#71717A"
footer-link-col: "#3F3F46"
footer-hover-col: "#A6192E"

# --- Misc --- #
date_format: "%B %-d, %Y"

# --- Collections --- #
collections:
  timeline:
    output: false
  news:
    output: false
  projects:
    output: false
  publications:
    output: false

# --- Build & Output Options --- #
timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - "_posts copy/"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
