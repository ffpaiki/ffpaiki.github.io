# --- Misc --- #
date_format: "%B %-d, %Y"

# --- Collections --- #
collections:
  timeline:
    output: false
  news:
    output: false
  projects:
    output: false
  publications:
    output: false

# --- Build & Output Options --- #
timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - "_posts copy/"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
